name: Godot 4.7.2 Sea Smoke Tests

on:
  push:
    branches: [penni-diving]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and validate project
        shell: bash
        run: |
          set -o pipefail
          godot --version
          set +e
          timeout 180s godot --headless --editor --path "hook,-line,-and-sinker" --quit 2>&1 | tee godot-import.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:' godot-import.log; then
            echo "Godot import reported an error."
            exit 1
          fi
      - name: Run scene architecture smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path "hook,-line,-and-sinker" --script "res://tests/sea_architecture_boundaries_test.gd" 2>&1 | tee godot-scene-test.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL  |FAILED:' godot-scene-test.log
