name: Godot 4.7.2 Sea Smoke Tests

on:
  push:
    branches: [penni-diving]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and validate project
        shell: bash
        run: |
          set -o pipefail
          godot --version
          set +e
          timeout 180s godot --headless --editor --path "hook,-line,-and-sinker" --quit 2>&1 | tee godot-import.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:' godot-import.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .); then
            echo "Godot import reported an error."
            exit 1
          fi
      - name: Start actual game scene
        shell: bash
        run: |
          set -o pipefail
          # A standalone SceneTree --script omits the game's autoloads.
          # Start the REAL main scene instead to validate its wiring.
          timeout 60s godot --headless --path "hook,-line,-and-sinker" --quit-after 120 2>&1 | tee godot-play.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:' godot-play.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test isolated spline terrain preview, textures and collision
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/sea_terrain_test.tscn 2>&1 | tee sea-terrain-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' sea-terrain-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test reusable sea decorations, sunbeams and underwater palette
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/sea_visual_systems_test.tscn 2>&1 | tee sea-visuals-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' sea-visuals-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test water diagnostic modes restore the game visuals
