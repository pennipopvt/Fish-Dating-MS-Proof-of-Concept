name: Godot 4.7.2 Sea Smoke Tests

on:
  push:
    branches: [penni-diving]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and validate project
        shell: bash
        run: |
          set -o pipefail
          godot --version
          set +e
          timeout 180s godot --headless --editor --path "hook,-line,-and-sinker" --quit 2>&1 | tee godot-import.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:' godot-import.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .); then
            echo "Godot import reported an error."
            exit 1
          fi
      - name: Start actual game scene
        shell: bash
        run: |
          set -o pipefail
          # A standalone SceneTree --script omits the game's autoloads.
          # Start the REAL main scene instead to validate its wiring.
          timeout 60s godot --headless --path "hook,-line,-and-sinker" --quit-after 120 2>&1 | tee godot-play.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:' godot-play.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test first catch and terminal progression
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/post_dive_terminal_test.tscn 2>&1 | tee post-dive-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' post-dive-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test habitat fish and sea attack animations
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/sea_population_and_visuals_test.tscn 2>&1 | tee sea-population-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' sea-population-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test unlocked challenge rewards and terminal notifications
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/terminal_shop_challenges_test.tscn 2>&1 | tee terminal-challenge-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' terminal-challenge-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test dive clock and free conversations
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/day_clock_test.tscn 2>&1 | tee day-clock-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' day-clock-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test date bookings and period costs
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/date_schedule_test.tscn 2>&1 | tee date-schedule-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' date-schedule-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test oxygen exhaustion, blackout and carried inventory
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/sea_oxygen_test.tscn 2>&1 | tee sea-oxygen-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' sea-oxygen-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test diving party and dock jump
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/diving_party_test.tscn 2>&1 | tee diving-party-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' diving-party-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test townhouse scene integration
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/townhouse_merge_test.tscn 2>&1 | tee townhouse-merge-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' townhouse-merge-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
      - name: Test quota deliveries and deadlines
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "hook,-line,-and-sinker" res://tests/quota_test.tscn 2>&1 | tee quota-test.log
          ! (grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:|FAIL ' quota-test.log | grep -Ev 'resources still in use at exit|RID allocations.*leaked' | grep -q .)
