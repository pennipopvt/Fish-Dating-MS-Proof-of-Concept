name: Godot penni-diving checks

on:
  push:
    branches: [penni-diving]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Godot version
        run: godot --version
      - name: Import project and compile scene dependencies
        working-directory: hook,-line,-and-sinker
        run: godot --headless --path . --import --quit
      - name: Camera and in-world boat
        working-directory: hook,-line,-and-sinker
        run: godot --headless --path . -s res://tests/world_camera_intro_test.gd
      - name: Original dock and intro transition
        working-directory: hook,-line,-and-sinker
        run: godot --headless --path . -s res://tests/diving_island_transition_test.gd
      - name: World camera and sea storyboard
        working-directory: hook,-line,-and-sinker
        run: godot --headless --path . -s res://tests/sea_storyboard_test.gd
      - name: Sea motion paths
        working-directory: hook,-line,-and-sinker
        run: godot --headless --path . res://tests/sea_motion_path_test.tscn
      - name: Diving companions
        working-directory: hook,-line,-and-sinker
        run: godot --headless --path . res://tests/diving_party_test.tscn
